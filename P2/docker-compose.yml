version: "3.8"
services:
  # Base de datos
  db:
    image: postgres:15-alpine
    container_name: videoclub_db
    restart: always
    environment:
      POSTGRES_USER: alumnodb
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: si1
    ports:
      - "9999:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./populate.sql:/docker-entrypoint-initdb.d/02_populate.sql:ro
      - postgres_data:/var/lib/postgresql/data

  # Microservicio de usuarios
  user_api:
    build: .
    container_name: videoclub_user_api
    command: python user.py
    ports:
      - "5050:5050"
    environment:
      DATABASE_URL: "postgresql+asyncpg://alumnodb:1234@db:5432/si1"
      SECRET_KEY: "clave_super_secreta_para_la_practica"
    depends_on:
      - db

  # Microservicio de la API principal
  main_api:
    build: .
    container_name: videoclub_main_api
    command: python api.py
    ports:
      - "5051:5051"
    environment:
      DATABASE_URL: "postgresql+asyncpg://alumnodb:1234@db:5432/si1"
      SECRET_KEY: "clave_super_secreta_para_la_practica"
    depends_on:
      - db

volumes:
  postgres_data:
