events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;

        location = /auth/validate {
            internal;
            proxy_pass http://auth-service:5050/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /auth/ {
            proxy_pass http://auth-service:5050;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /library/ {
            auth_request /auth/validate;
            auth_request_set $auth_user $upstream_http_x_user_id;

            proxy_set_header X-User-Id $auth_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://library-service:5051;
        }
    }
}