services:
  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend_net

  mongodb:
    image: mongo:7
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  auth-service:
    build:
      context: ./auth-service
      network: host
    expose:
      - "5050"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_TTL=300
    volumes:
      - ./auth-service/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_net

  library-service:
    build:
      context: ./library-service
      network: host
    expose:
      - "5051"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=library_db
    volumes:
      - ./library-service/app:/app/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend_net

  nginx:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - library-service
    networks:
      - backend_net

volumes:
  redis_data:
  mongo_data:

networks:
  backend_net:
    driver: bridge
